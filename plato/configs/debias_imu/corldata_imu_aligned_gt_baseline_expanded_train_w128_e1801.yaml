dataset: corldata
supervision: gt
loss_type: se23_gt_supervision
input_mode: u_dot_u

data_root: results/debias_imu/corldata_IMU_aligned_gt_vo_ref_1000hz
cache_dir: results/debias_imu/cache/corldata_imu_aligned_gt_baseline_expanded_train_w128_e1801_1000hz
outputdir: results/debias_imu/corldata_imu_aligned_gt_baseline_expanded_train_w128_e1801_1000hz

# Strict original-style baseline run on the IMU-aligned corldata export.
# S04 is excluded because prior diagnostics found a severe mocap/GT jump.
# S01, S05, and S07 are kept, but local bad windows are filtered through
# mav0/quality/valid_window_starts_128.txt.
train_seqs: [S00, S01, S02, S03, S05, S07]
test_seqs: [S13, S15, S20, S21, S22, S23]
window_size: 128
dt: 0.001
batch_size: 1000
epoch: 1801
percent_for_val: 0.2
train_batch_strategy: random_sequence

# Original Debias_IMU baseline network family: dot b = NN(b, u, u_dot).
network_type_Gyro: bw_func_net
network_type_Acc: ba_func_net
lr_Gyro: 0.005
lr_Acc: 0.005
weight_decay_Gyro: 0.000001
weight_decay_Acc: 0.000001
gyro_lr_step_size: 300
acc_lr_step_size: 300
gyro_lr_gamma: 0.5
acc_lr_gamma: 0.5
val_freq: 100
save_freq: 100

# Match the original testing convention: train functions still save
# best_val_model.pt, but Acc training and final testing load the last saved
# checkpoint, model_epoch_1800.pt.
use_best_val: false
readable_val_metrics: true

sg_window_bw: 101
sg_order_bw: 3
sg_window_ba: 101
sg_order_ba: 3

device: cuda
test_device: cpu
