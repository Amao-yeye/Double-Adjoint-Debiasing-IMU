dataset: euroc
train_supervision: vo
supervision_timing: source

model:
  type: bias_dynamics_node
  use_udot: false
loss:
  type: se23_mse
supervision_config:
  mode: source_window
  source_poses: 64
  align_to_imu_frame: true

cache_dir: results/debias_imu/cache/EUROC_tiny_acc_fixed_gyro_vo_src64_se23_acc_long_pretrain
test_cache_dir: results/debias_imu/cache/EUROC_test_gt
outputdir: results/debias_imu/EUROC_tiny_acc_fixed_gyro_vo_src64_se23_acc_long_pretrain

# Stage-1 long-window mean pretraining before trajectory-state NLL.
# The previous NLL pilot showed that starting NLL directly from the short-window
# model mostly changes sigma; this run lets the Acc bias dynamics mean adapt to
# 64 VO/source-pose windows while keeping the robust tiny gyro fixed.
network_type_Gyro: bw_func_slow_residual_tiny
network_type_Acc: ba_func_slow_residual_tiny
bw_model_path: results/debias_imu/EUROC_slow_residual_tiny_constinit_gt_w64_sg_ad_e301_b1000/Gyro_weights/model_epoch_0.pt
ba_init_model_path: results/debias_imu/EUROC_tiny_acc_fixed_gyro_vo_body_w64_sg_ad_e301_b1000_noV203/Acc_weights/best_val_model.pt
skip_gyro_train: true

exclude_train_seq: [V2_03_difficult]
loss_window: 64
# EuRoC VO/source timestamps are about 20 Hz: 64 poses span about 3.15 s.
batch_size: 64
epoch: 101
lr_Gyro: 0.0005
lr_Acc: 0.0001
weight_decay_Gyro: 0.000001
weight_decay_Acc: 0.000001
gyro_lr_step_size: 75
acc_lr_step_size: 75
gyro_lr_gamma: 0.5
acc_lr_gamma: 0.5
val_freq: 10
save_freq: 25
train_batch_strategy: random_sequence
percent_for_val: 0.2

acc_loss_type: se23
acc_loss_rot_weight: 1.0
acc_loss_vel_weight: 1.0
acc_loss_pos_weight: 1.0

use_best_val: true
readable_val_metrics: true

sg_window_bw: 15
sg_order_bw: 3
sg_window_ba: 15
sg_order_ba: 3
dt: 0.005

initial_bias_mode: median_window
initial_bias_window_s: 5.0

device: cuda
test_device: cpu
