dataset: corldata
supervision: gt
loss_type: se23_gt_supervision
input_mode: u_dot_u
trainval_supervision_source: mocap_noninterp

data_root: results/debias_imu/corldata_IMU_aligned_gt_vo_ref_sparse_gt
cache_dir: results/debias_imu/cache/corldata_sparse_endpoint_baseline_w64_e601
outputdir: results/debias_imu/corldata_sparse_endpoint_baseline_w64_e601

# Sparse endpoint supervision: GT poses keep original mocap timestamps.
# Each training window starts from a GT state, integrates the intervening IMU,
# and computes SE23 loss only at sparse GT endpoints. No dense 1000 Hz GT pose
# interpolation is used for train/val supervision.
train_seqs: [S00, S01, S02, S03, S05, S07]
test_seqs: [S13, S15, S20, S21, S22, S23]
window_size: 64
dt: 0.001
batch_size: 256
epoch: 601
percent_for_val: 0.2
train_batch_strategy: random_sequence

# Keep the original Debias_IMU network family first, to isolate the effect of
# changing the supervision from dense GT interpolation to IMU-to-GT endpoints.
network_type_Gyro: bw_func_net
network_type_Acc: ba_func_net
lr_Gyro: 0.005
lr_Acc: 0.005
weight_decay_Gyro: 0.000001
weight_decay_Acc: 0.000001
gyro_lr_step_size: 300
acc_lr_step_size: 300
gyro_lr_gamma: 0.5
acc_lr_gamma: 0.5
val_freq: 50
save_freq: 100

acc_loss_rot_weight: 1.0
acc_loss_vel_weight: 1.0
acc_loss_pos_weight: 1.0

use_best_val: false
readable_val_metrics: true

sg_window_bw: 31
sg_order_bw: 3
sg_window_ba: 31
sg_order_ba: 3

device: cuda
test_device: cpu
