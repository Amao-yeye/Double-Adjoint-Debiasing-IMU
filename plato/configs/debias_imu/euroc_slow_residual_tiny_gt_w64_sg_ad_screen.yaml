dataset: euroc
train_supervision: gt
supervision_timing: imu
cache_dir: results/debias_imu/cache/EUROC_slow_residual_tiny_gt_w64_sg
test_cache_dir: results/debias_imu/cache/EUROC_test_gt
outputdir: results/debias_imu/EUROC_slow_residual_tiny_constinit_gt_w64_sg_ad_e301_b1000

# Strict no-u_dot, tiny rate-limited residual. This is designed to preserve
# the strong constant-bias start and only learn small bias-rate corrections.
network_type_Gyro: bw_func_slow_residual_tiny
network_type_Acc: ba_func_slow_residual_tiny
gyro_loss: ad
acc_loss: se23
loss_window: 64
batch_size: 1000
epoch: 301
lr_Gyro: 0.0005
lr_Acc: 0.0005
weight_decay_Gyro: 0.000001
weight_decay_Acc: 0.000001
gyro_lr_step_size: 150
acc_lr_step_size: 150
gyro_lr_gamma: 0.5
acc_lr_gamma: 0.5
val_freq: 50
save_freq: 100
sg_window_bw: 101
sg_order_bw: 3
sg_window_ba: 31
sg_order_ba: 3
initial_bias_mode: median_window
initial_bias_window_s: 5.0
device: cuda
test_device: cpu
use_best_val: true
readable_val_metrics: true
