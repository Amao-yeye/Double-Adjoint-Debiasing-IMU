dataset: euroc
only_test: true

train_supervision: gt
trainval_gt_root: results/debias_imu/Euroc_GT_at_VO_timestamps_dedup
trainval_gt_source: state_groundtruth_estimate0
supervision_timing: source
exclude_train_seq:
  - V2_03_difficult

# The original training cache was intentionally removed during cleanup.  This
# retained EuRoC cache has the same SG-smoothed train/test bias files needed for
# train-only global bias initialization and held-out test rollout.
cache_dir: results/debias_imu/cache/EUROC_test_gt
test_cache_dir: results/debias_imu/cache/EUROC_test_gt
outputdir: results/debias_imu/EUROC_unified_no_udot_mse_checkpoint_train_global_median_onlytest

network_type_Gyro: bw_func_net_no_udot
network_type_Acc: ba_func_net_no_udot
bw_model_path: results/debias_imu/checkpoints/unified_no_udot_zero_init/gyro_zero_output.pt
ba_model_path: results/debias_imu/checkpoints/euroc_unified_no_udot_mse_lowlr_e51_oracle_audit/acc_best_val_model.pt

gyro_loss: ad
acc_loss: se23
loss_window: 32
batch_size: 128
epoch: 51

sg_window_bw: 101
sg_order_bw: 3
sg_window_ba: 31
sg_order_ba: 3

initial_bias_mode: train_global_median
initial_bias_window_s: 5.0

device: cuda
test_device: cpu
use_best_val: true
readable_val_metrics: true
