dataset: euroc
train_supervision: gt
trainval_gt_root: results/debias_imu/Euroc_GT_at_VO_timestamps_dedup
trainval_gt_source: state_groundtruth_estimate0
supervision_timing: source
exclude_train_seq:
  - V2_03_difficult

cache_dir: results/debias_imu/cache/EUROC_no_udot_gt_vorate_src32_mse_first
test_cache_dir: results/debias_imu/cache/EUROC_test_gt
outputdir: results/debias_imu/EUROC_no_udot_gt_vorate_src32_mse_first_lr1e3_e101

# Capacity check for the same core no-u_dot family that currently works best
# on corldata. Both gyro and acc start at zero-output constant dynamics; test
# uses first-bias initialization, not the oracle 5 s median window.
network_type_Gyro: bw_func_net_no_udot
network_type_Acc: ba_func_net_no_udot
gyro_loss: ad
acc_loss: se23
acc_loss_type: se23

loss_window: 32
batch_size: 128
epoch: 101
lr_Gyro: 0.001
lr_Acc: 0.001
weight_decay_Gyro: 0.000001
weight_decay_Acc: 0.000001
gyro_lr_step_size: 50
acc_lr_step_size: 50
gyro_lr_gamma: 0.5
acc_lr_gamma: 0.5
val_freq: 10
save_freq: 25
train_batch_strategy: random_sequence
percent_for_val: 0.2

acc_loss_rot_weight: 1.0
acc_loss_vel_weight: 1.0
acc_loss_pos_weight: 1.0

sg_window_bw: 101
sg_order_bw: 3
sg_window_ba: 31
sg_order_ba: 3

initial_bias_mode: first
initial_bias_window_s: 5.0

device: cuda
test_device: cpu
use_best_val: true
readable_val_metrics: true
