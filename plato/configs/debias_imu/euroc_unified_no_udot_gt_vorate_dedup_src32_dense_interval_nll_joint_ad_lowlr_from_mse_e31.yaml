dataset: euroc
train_supervision: gt
trainval_gt_root: results/debias_imu/Euroc_GT_at_VO_timestamps_dedup
trainval_gt_source: state_groundtruth_estimate0
supervision_timing: source
exclude_train_seq:
  - V2_03_difficult

cache_dir: results/debias_imu/cache/EUROC_unified_no_udot_gt_vorate_dedup_src32_dense
test_cache_dir: results/debias_imu/cache/EUROC_test_gt
outputdir: results/debias_imu/EUROC_unified_no_udot_gt_vorate_dedup_src32_dense_interval_nll_joint_ad_lowlr_from_mse_e31

# Stage 2 for the unified no-u_dot architecture: conservative AD interval-NLL
# fine-tune from the best-val MSE checkpoint.  Gyro is kept fixed to preserve
# the EuRoC orientation result; Acc uses a small LR because long-horizon test
# position is the primary metric.
network_type_Gyro: bw_func_net_no_udot
network_type_Acc: ba_func_net_no_udot
bw_model_path: results/debias_imu/checkpoints/unified_no_udot_zero_init/gyro_zero_output.pt
ba_init_model_path: results/debias_imu/EUROC_unified_no_udot_gt_vorate_dedup_src32_dense_mse_lowlr_e51/Acc_weights/best_val_model.pt
skip_gyro_train: true
nll_train_gyro: false
gyro_loss: ad
acc_loss: se23
acc_loss_type: interval_nll
interval_nll_mode: nll_joint

loss_window: 32
batch_size: 128
epoch: 31
lr_Gyro: 0.005
lr_Acc: 0.000001
weight_decay_Gyro: 0.000001
weight_decay_Acc: 0.000001
gyro_lr_step_size: 150
acc_lr_step_size: 30
gyro_lr_gamma: 0.5
acc_lr_gamma: 0.5
val_freq: 5
save_freq: 10
train_batch_strategy: random_sequence
percent_for_val: 0.2

interval_sigma_a_nominal: 0.002793442
interval_sigma_g_nominal: 0.000241539
interval_sigma_a_floor2: 0.0000000001
interval_sigma_g_floor2: 0.000000000001
interval_target_cov_floor: 0.000000001
interval_jitter: 0.00000001
interval_lr_sigma: 0.001
interval_prior_lambda_a: 0.001
interval_prior_lambda_g: 0.001
interval_detach_covariance_theta: true
interval_covariance_gradient_mode: ad
interval_debug_covariance_gradients: false

acc_loss_rot_weight: 1.0
acc_loss_vel_weight: 1.0
acc_loss_pos_weight: 1.0

sg_window_bw: 101
sg_order_bw: 3
sg_window_ba: 31
sg_order_ba: 3

initial_bias_mode: median_window
initial_bias_window_s: 5.0

device: cuda
test_device: cpu
use_best_val: true
readable_val_metrics: true
