%YAML:1.0

# PLATO corldata stereo-inertial configuration for DAVIS APS stereo images.
# Camera parameters are taken from /home/amao/datasets/corldata/configuration/cam0.yaml
# and cam1.yaml. Camera/IMU and stereo extrinsics are taken from uw_robot.yaml.
# Use with ORB-SLAM3 stereo-inertial mode; the IMU CSV must be shifted to the
# camera clock before calling the TUM-VI loader.

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 312.0206439606905
Camera1.fy: 312.4734720152093
Camera1.cx: 159.57147431980286
Camera1.cy: 125.55510681344391
Camera1.k1: -0.30624346790624646
Camera1.k2: 0.1425146717217006
Camera1.p1: -0.0013100988384794235
Camera1.p2: -0.0047694614401734324

Camera2.fx: 310.8584570180142
Camera2.fy: 311.4594070713915
Camera2.cx: 190.26035791110112
Camera2.cy: 131.3065531064017
Camera2.k1: -0.30328331620524857
Camera2.k2: 0.1270139887276728
Camera2.p1: -0.0013512660200573788
Camera2.p2: 0.001013934053373898

Camera.width: 346
Camera.height: 260
Camera.fps: 38
Camera.RGB: 1

Stereo.ThDepth: 40.0
Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.999124279, 0.000331362, 0.041839652, 0.197746311,
         -0.000262872, 0.999998617, -0.001642333, -0.001486741,
         -0.041840144, 0.001629895, 0.999122986, -0.003995156,
         0.0, 0.0, 0.0, 1.0]

# Transformation from left DAVIS/camera frame to body frame. In ORB-SLAM3
# stereo-inertial mode the body frame is the IMU frame: T_b_c1.
IMU.T_b_c1: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.99982062, -0.00531549, -0.01817911, 0.00126654,
         0.00546713, 0.99995059, 0.00830192, -0.00295328,
         0.01813409, -0.00839982, 0.99980028, 0.00206342,
         0.0, 0.0, 0.0, 1.0]

IMU.NoiseGyro: 0.00363608382743
IMU.NoiseAcc: 0.0436073667065
IMU.GyroWalk: 4.54949206016e-05
IMU.AccWalk: 0.000691276415008
IMU.Frequency: 1000.0
IMU.InsertKFsWhenLost: 1
IMU.fastInit: 1

# uw_robot.yaml records g_norm: 9.7803. This ORB-SLAM3 checkout uses the
# hard-coded IMU::GRAVITY_VALUE in source, so this field is audit-only unless
# the ORB-SLAM3 source is extended to read it.
IMU.GravityMagnitude: 9.7803

# uw_robot.yaml td means: image clock + td = IMU clock. The TUM-VI
# stereo-inertial runner expects IMU samples in the image clock, so use
# t_imu_for_orbslam3 = t_imu_raw - 0.00777437.
IMU.TimeShiftCamToImu: 0.00777437

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 12
ORBextractor.minThFAST: 5

Viewer.KeyFrameSize: 0.07
Viewer.KeyFrameLineWidth: 3.0
Viewer.GraphLineWidth: 4.0
Viewer.PointSize: 4.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 4.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.5
