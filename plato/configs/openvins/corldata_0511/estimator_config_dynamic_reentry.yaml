%YAML:1.0

# corldata 0511 DAVIS stereo + left DAVIS IMU.
# Dynamic-initialization OpenVINS config for moving-start testing sequences.

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2
use_learned_bias_dynamics: false
freeze_imu_bias: false
frozen_imu_bias_g: [0.0, 0.0, 0.0]
frozen_imu_bias_a: [0.0, 0.0, 0.0]
frozen_imu_bias_cov: 1e-12
learned_bias_dynamics_model: "phys_delta"
learned_bias_dynamics_weights: "/home/amao/workspace/PLATO/results/debias_imu/LIASuw_phys_delta_e1800_w16_b64/openvins/phys_delta_openvins.yaml"

calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.7803

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

init_window_time: 2.0
init_imu_thresh: 1.5
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.5
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 5.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/corldata_openvins_dynamic_timing.txt"

# PLATO re-entry stabilization for natural corldata light-off/light-on tests.
# It detects image mean brightness crossing from dark back to light, clears stale
# KLT tracks, and temporarily relaxes filter covariance so visual updates can
# recover after learned-IMU dark propagation.
plato_reentry_enable: true
plato_reentry_brightness_threshold: 25.0
plato_reentry_light_threshold: 25.0
plato_reentry_dark_confirm_s: 0.5
plato_reentry_light_confirm_s: 0.5
plato_reentry_long_dark_threshold_s: 10.0
plato_reentry_gray_dark_threshold: 5.0
plato_reentry_long_dark_light_confirm_s: 0.2
plato_reentry_clear_tracks: true
plato_reentry_inflate_covariance: true
plato_reentry_ori_std_deg: 5.0
plato_reentry_pos_std_m: 10.0
plato_reentry_vel_std_mps: 2.0
plato_reentry_bg_std_rad_s: 0.02
plato_reentry_ba_std_m_s2: 0.10
plato_reentry_clone_ori_std_deg: 5.0
plato_reentry_clone_pos_std_m: 10.0

# ROS1Visualizer reads this through ROS params in serial runs, so also pass
# `_save_total_state:=true` when launching `ros1_serial_msckf`.
save_total_state: true
filepath_est: "/tmp/corldata_openvins_dynamic_estimate.txt"
filepath_std: "/tmp/corldata_openvins_dynamic_std.txt"
filepath_gt: "/tmp/corldata_openvins_dynamic_groundtruth.txt"

use_klt: true
num_pts: 200
fast_threshold: 12
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 20.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
